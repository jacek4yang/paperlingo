[project]
name = "paperlingo"
version = "0.1.0"
description = "把论文中没看懂的英文拆开讲明白：精准翻译 + 句子结构 + 语法 + 单词 + 学术表达，沉淀为个人英语知识库。"
authors = [
    { name = "jacekSmile", email = "202203150323@zjut.edu.cn" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.13.5",
    "pyqt6>=6.11.0",
]

[project.scripts]
paperlingo = "paperlingo:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # 长行多为中文文案 / QSS，交由人工控制
    "B008",    # Qt 风格 API 中函数调用作默认值是常见写法
    "RUF001",  # 中文文案中的全角标点是有意使用
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["paperlingo"]
